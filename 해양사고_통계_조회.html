<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>해양사고 통계 조회</title>
  <style>
    :root { --navy:#12355b; --blue:#1769aa; --pale:#eef6fc; --line:#d7e2ed; --ink:#17212b; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f8fb; color:var(--ink); font-family:"Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    main { max-width:1200px; margin:0 auto; padding:32px 20px 48px; }
    header { margin-bottom:22px; }
    h1 { margin:0 0 8px; color:var(--navy); font-size:clamp(1.55rem, 4vw, 2.15rem); }
    .subtitle, .source { margin:0; color:#536474; font-size:.95rem; line-height:1.6; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(22,45,69,.06); overflow:hidden; }
    .controls { display:grid; grid-template-columns:minmax(0, 1fr) 220px; gap:12px; padding:20px; border-bottom:1px solid var(--line); }
    label { display:block; margin-bottom:7px; color:#30475d; font-size:.86rem; font-weight:700; }
    input, select { width:100%; min-height:44px; border:1px solid #bdcede; border-radius:9px; padding:0 12px; background:#fff; color:var(--ink); font:inherit; }
    input:focus, select:focus { outline:3px solid #bde0f8; border-color:var(--blue); }
    .status { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; background:var(--pale); color:#29465e; font-size:.94rem; }
    #count { font-weight:700; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:1050px; border-collapse:collapse; font-size:.87rem; }
    thead { background:var(--navy); color:#fff; }
    th, td { padding:12px 10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
    th { font-weight:700; }
    th:first-child, td:first-child { text-align:center; font-weight:700; }
    tbody tr:nth-child(even) { background:#f8fbfd; }
    tbody tr:hover { background:#e9f4fc; }
    .empty { padding:46px 20px; text-align:center; color:#647687; }
    footer { margin-top:18px; padding:16px 18px; border-left:4px solid var(--blue); background:#eaf3fa; color:#345169; font-size:.9rem; line-height:1.65; }
    @media (max-width: 400px) {
      main { padding:20px 12px 32px; }
      .controls { grid-template-columns:1fr; padding:16px; }
      .status { display:block; padding:12px 16px; }
      .status span + span { display:block; margin-top:4px; }
      /* 작은 화면은 표 대신 행별 카드로 전환하여 가로 스크롤을 없앱니다. */
      .table-wrap { overflow:visible; }
      table, thead, tbody, tr, th, td { display:block; min-width:0; width:100%; }
      thead { display:none; }
      tbody { padding:8px; }
      tbody tr { margin:8px 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff !important; }
      td { display:grid; grid-template-columns:1fr auto; gap:12px; padding:8px 10px; border-bottom:1px solid #e6edf3; text-align:right; }
      td::before { content:attr(data-label); color:#526879; text-align:left; font-weight:600; }
      td:first-child { background:var(--pale); color:var(--navy); }
      .empty { display:block; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>해양사고 통계 조회</h1>
      <p class="subtitle">연도별 사고 유형별 발생 건수</p>
    </header>
    <section class="panel" aria-label="해양사고 통계 표">
      <div class="controls">
        <div>
          <label for="search">연도 또는 사고 유형 검색</label>
          <input id="search" type="search" placeholder="예: 2011, 충돌, 기관손상" autocomplete="off">
        </div>
        <div>
          <label for="year">연도 필터</label>
          <select id="year"><option value="">전체 연도</option></select>
        </div>
      </div>
      <div class="status"><span id="count" aria-live="polite"></span><span>단위: 건</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr id="head-row"></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
    <footer>
      <strong>출처</strong>: 제공된 <code>data.json</code> &nbsp;|&nbsp; <strong>기준 시점</strong>: 2012년 (수록 기간: 1998~2012년)
    </footer>
  </main>

    const search = document.querySelector('#search');
    const year = document.querySelector('#year');
    const body = document.querySelector('#table-body');
    document.querySelector('#head-row').innerHTML = columns.map(c => `<th scope="col">${c}</th>`).join('');
    data.forEach(row => year.add(new Option(`${row.시점}년`, row.시점)));
    function render() {
      const term = search.value.trim().toLowerCase();
      const selectedYear = year.value;
      const rows = data.filter(row => {
        const matchesYear = !selectedYear || String(row.시점) === selectedYear;
        const matchesSearch = !term || columns.some(key => key.toLowerCase().includes(term)) || String(row.시점).includes(term);
        return matchesYear && matchesSearch;
      });
      document.querySelector('#count').textContent = `현재 ${rows.length}건 / 전체 ${data.length}건`;
      body.innerHTML = rows.length ? rows.map(row => `<tr>${columns.map(key => `<td data-label="${key}">${Number(row[key]).toLocaleString()}</td>`).join('')}</tr>`).join('') : `<tr><td class="empty" colspan="${columns.length}">조건에 맞는 데이터가 없습니다.</td></tr>`;
    }
    search.addEventListener('input', render);
    year.addEventListener('change', render);
    render();

</html>
